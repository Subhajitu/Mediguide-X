<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="xGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <radialGradient id="mintGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0" />
    </radialGradient>
    
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F766E" flood-opacity="0.12" />
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="textXGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
  </defs>

  <svg x="0" y="0" width="64" height="64" viewBox="0 0 256 256">
    <!-- Outer Glow -->
    <circle cx="128" cy="128" r="110" fill="url(#mintGlow)" filter="url(#softGlow)" />

    <!-- Rounded Hexagon -->
    <polygon points="128,36 207.6,82 207.6,174 128,220 48.4,174 48.4,82" 
             fill="#FFFFFF" 
             stroke="#D7F5E6" 
             stroke-width="16" 
             stroke-linejoin="round" 
             filter="url(#dropShadow)" />

    <!-- Stylized Elegant X -->
    <g stroke="url(#xGradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 100,100 C 120,100 128,120 128,128 C 128,136 136,156 156,156" />
      <path d="M 156,100 C 136,100 128,120 128,128 C 128,136 120,156 100,156" />
      <circle cx="128" cy="128" r="3" fill="url(#xGradient)" stroke="none" />
      <path d="M 88,88 L 94,94 M 168,168 L 162,162 M 168,88 L 162,94 M 88,168 L 94,162" stroke-width="4" />
    </g>
  </svg>
  
  <!-- Gap is 16px, so x = 64 + 16 = 80 -->
  <text x="80" y="44" font-family="Inter, Manrope, sans-serif" font-weight="700" font-size="34" letter-spacing="-0.5" fill="#0F172A">
    Mediguide<tspan fill="url(#textXGradient)">X</tspan>
  </text>
</svg>
